name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Không để job treo hàng giờ khi mạng của runner gặp sự cố (bình thường chạy ~1 phút).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # Kho apt của runner (azure.archive.ubuntu.com) đôi khi mất DNS và làm bước này treo.
      # Giới hạn thời gian, và nếu apt lỗi thì lấy ffmpeg/ffprobe bản dựng sẵn từ GitHub Releases.
      - name: Cài ffmpeg (apt)
        id: apt_ffmpeg
        continue-on-error: true
        timeout-minutes: 6
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y --no-install-recommends ffmpeg

      - name: Cài ffmpeg (dự phòng khi apt lỗi)
        if: steps.apt_ffmpeg.outcome != 'success'
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Kiểm tra ffmpeg
        run: ffmpeg -version | head -n 1 && ffprobe -version | head -n 1

      - name: Cài dependency
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chạy test
        run: python -m pytest -q
