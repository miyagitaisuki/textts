# Cấu hình engine và vai nhân vật.
# Giá trị ở câu (ví dụ [2]{emotion=happy}) luôn đè lên giá trị ở đây.
engine: edge

# Nhịp đọc (ms). Mức đề xuất cho bài nghe của người học.
timing:
  lead_in_ms: 300          # lặng đầu bài
  turn_gap_ms: 1400        # đổi người nói
  same_speaker_gap_ms: 800 # cùng người nói, sang câu thoại mới
  question_gap_ms: 300     # chờ thêm sau câu hỏi
  sentence_pause_ms: 800   # trong một câu thoại: dừng sau 。！？ (0 = đọc liền)
  comma_pause_scale: 1.5   # kéo dài chỗ ngắt ở 、 (VOICEVOX/AivisSpeech; 1.0 = như engine)
  tail_ms: 500             # lặng cuối bài

roles:
  "1":
    name: 学生
    voice: ja-JP-KeitaNeural
    emotion: neutral
    speed: normal
    pitch: 0
  "2":
    name: 駅員
    voice: ja-JP-NanamiNeural
    emotion: neutral
    speed: normal
    pitch: 0
  "3":
    name: 田中
    voice: ja-JP-NanamiNeural   # Edge chỉ có 2 giọng ja-JP; vai 3 tạm đổi pitch
    emotion: neutral
    speed: normal
    pitch: -8
